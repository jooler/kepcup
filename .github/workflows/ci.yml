name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & typecheck (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Root typecheck builds shared+core first so dependents resolve @kepcup/* dist types.
      - run: pnpm typecheck

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # sign-connector-index (and schema imports) need @kepcup/shared dist.
      - run: pnpm --filter @kepcup/shared run build
      # Sandbox tests (P02) need user namespaces on Ubuntu 24.04 (AppArmor)
      # and srt's Linux dependencies; see docs/dev/05-testing.md "CI 矩阵".
      - name: Enable sandboxing (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # ripgrep: srt Linux mandatory deny scan; bundled rg under
          # apps/desktop/resources/bin/ is preferred via SandboxRuntimeConfig.ripgrep,
          # system rg is the PATH fallback when the bundle is missing.
          sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
          # srt's vendor seccomp helper must be executable; missing bit → ENOENT inside bwrap.
          SECCOMP=$(find node_modules -path '*/sandbox-runtime/vendor/seccomp/x64/apply-seccomp' -type f | head -1)
          if [ -n "$SECCOMP" ]; then
            chmod +x "$SECCOMP"
            ls -la "$SECCOMP"
          else
            echo "::warning::apply-seccomp not found after install; Linux sandbox tests will fail"
          fi
      # Unit & integration tests run with Electron as the Node runtime so
      # native modules load; see docs/dev/05-testing.md.
      - run: pnpm test

  e2e:
    name: E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # End-to-end tests from P01 (docs/dev/05-testing.md, CI matrix).
      # Headless Electron on Linux runs inside xvfb; sandbox-dependent specs
      # (mcp-apps cards, sandbox, wiki 抓取) additionally need bwrap/socat + the
      # Ubuntu 24.04 userns sysctl, same as the "Enable sandboxing" step in the
      # test job above.
      - name: Enable sandboxing (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
          SECCOMP=$(find node_modules -path '*/sandbox-runtime/vendor/seccomp/x64/apply-seccomp' -type f | head -1)
          if [ -n "$SECCOMP" ]; then
            chmod +x "$SECCOMP"
          else
            echo "::warning::apply-seccomp not found after install; sandboxed e2e specs will fail"
          fi
      - name: Install xvfb (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run e2e (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: xvfb-run --auto-servernum pnpm test:e2e
      - name: Run e2e (macOS / Windows)
        if: matrix.os != 'ubuntu-24.04'
        run: pnpm test:e2e
      # playwright failure snapshots (error-context.md) are written to
      # test-results; without them a failing runner's page state is invisible.
      - name: Upload e2e failure snapshots
        if: failure() && matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-${{ matrix.os }}
          path: apps/desktop/test-results
          retention-days: 7
          if-no-files-found: ignore

  # Sandbox tests arrive with P02 (docs/dev/05-testing.md, CI matrix).
