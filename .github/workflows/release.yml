# 发行流水线（docs/dev/06-release.md）。
#
# 触发：推送 main（或手动 workflow_dispatch）。只有当 apps/desktop/package.json 的版本
# X.Y.Z 对应的 tag vX.Y.Z 还不存在时才构建并发布——日常推 main（没改版本号）只跑 CI，
# 不发版；0.0.0 与预发布版本（带 -）永不发布。
#
# 流程：prepare（判定版本）→ rootfs（Windows 包要的 WSL rootfs）→ build（五个平台 job，
# 一律 --publish never，见 BR-P13-003）→ publish（合并 mac 双架构更新清单，草稿 Release
# 上传全部产物后再转正式，用户端 electron-updater 不会看到缺文件的半成品）。
# 任一平台构建失败则整个版本不发布；修好后重新推送或手动重跑本工作流即可。
#
# 机密（Settings → Secrets → Actions；用 scripts/release/sync-github-secrets.mjs 从
# .env.release 同步）：
#   MAC_CSC_LINK / MAC_CSC_KEY_PASSWORD          Developer ID Application 证书（base64 .p12）
#   APPLE_API_KEY_BASE64 / APPLE_API_KEY_ID / APPLE_API_ISSUER   公证（App Store Connect API 密钥）
#   WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD          Windows 代码签名证书（可选）
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET      打进产物的 Google OAuth 桌面客户端（可选，dist.mjs 读取）
# 变量（Settings → Variables → Actions，公开信息）：
#   MSSTORE_IDENTITY_NAME / MSSTORE_PUBLISHER / MSSTORE_PUBLISHER_DISPLAY_NAME
#     Partner Center「产品标识」三项；设置后 Windows job 额外产出商店用 MSIX（workflow 工件 store-msix）。

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Decide version
    # 手动触发也只从 main 发布。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$version" = "0.0.0" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "版本 $version 不发布（只发布大于 0.0.0 的 X.Y.Z）。" >> "$GITHUB_STEP_SUMMARY"
          else
            # --exit-code：0 = tag 存在，2 = 不存在，其他 = 网络/鉴权错误（直接失败，不能当成「不存在」）。
            status=0
            git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null || status=$?
            if [ "$status" = 0 ]; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "v$version 已发布；没有新版本号，跳过。" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$status" = 2 ]; then
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "发布 v$version。" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "git ls-remote failed with $status"; exit 1
            fi
          fi

  # rootfs.tar 是 Windows 安装包的一部分（P12 CI 产出方案接线，P13 落地）。
  rootfs:
    name: WSL rootfs (Debian 12, for Windows targets)
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # 依赖 docker（ubuntu runner 自带）。脚本把 rootfs.tar + rootfs-manifest.json
      # 直接写入 apps/desktop/resources/wsl/（产物守卫内置：大小下限 + 关键成员校验）。
      - name: Build rootfs.tar
        run: bash apps/desktop/scripts/build-wsl-rootfs/build-rootfs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wsl-rootfs
          path: apps/desktop/resources/wsl/
          retention-days: 7

  build:
    name: ${{ matrix.name }}
    needs: [prepare, rootfs]
    strategy:
      fail-fast: false
      # 目标必须写全（dmg zip / AppImage deb）：只给架构时 electron-builder 会沿用配置里的
      # arch 列表，两个架构都构建，跨 job 产出同名文件。
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            platform: mac
            args: --mac dmg zip --arm64
          - name: macOS x64
            os: macos-15-intel
            platform: mac
            args: --mac dmg zip --x64
          # x64 + arm64 必须同一次构建：合并成一个 NSIS 安装包和唯一的 latest.yml。
          - name: Windows x64+arm64
            os: windows-latest
            platform: win
            args: --win nsis --x64 --arm64
          - name: Linux x64
            os: ubuntu-24.04
            platform: linux
            args: --linux AppImage deb --x64
          - name: Linux arm64
            os: ubuntu-24.04-arm
            platform: linux
            args: --linux AppImage deb --arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - uses: actions/download-artifact@v4
        if: matrix.platform == 'win'
        with:
          name: wsl-rootfs
          path: apps/desktop/resources/wsl
      - name: Prepare macOS signing
        if: matrix.platform == 'mac'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [ -z "$MAC_CSC_LINK" ]; then
            echo "::warning::MAC_CSC_LINK 未配置：macOS 产物未签名未公证，用户会被 Gatekeeper 拦截，且自动更新不可用。"
          fi
          # electron-builder 26 的 APPLE_API_KEY 必须是 .p8 文件路径（不接受 base64 内容）。
          if [ -n "$APPLE_API_KEY_BASE64" ]; then
            echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi
      # Import into the login keychain instead of letting electron-builder create a temp
      # keychain + set-key-partition-list (flakes with SecKeychainUnlock on macos-latest arm64).
      # Secrets are present on this repo (arm64/x64 have signed before). If MAC_CSC_LINK
      # is ever cleared, this step fails loudly instead of producing an unsigned release.
      - name: Import macOS signing certificate
        if: matrix.platform == 'mac'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MAC_CSC_LINK }}
          p12-password: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      - name: Build distributable
        working-directory: apps/desktop
        env:
          # electron-builder's node module collector (and npm ls fallback) OOMs at ~2GB on macOS runners.
          NODE_OPTIONS: --max-old-space-size=8192
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MSSTORE_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          # 机密缺失时 Actions 给的是空字符串，electron-builder 在 mac 上会把 "" 当成证书路径而失败。
          [ -n "${CSC_LINK:-}" ] || unset CSC_LINK CSC_KEY_PASSWORD
          # mac：证书已由 import-codesign-certs 进 keychain。再传 CSC_LINK 会另建临时
          # keychain，arm64 runner 上 set-key-partition-list 常报 SecKeychainUnlock。
          # dist.mjs 在无 CSC_LINK/CSC_NAME 时会关 CSC_IDENTITY_AUTO_DISCOVERY，所以要导出 CSC_NAME。
          if [ "${{ matrix.platform }}" = "mac" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            # electron-builder rejects CSC_NAME that still has the
            # "Developer ID Application:" prefix — strip it.
            CSC_NAME=$(security find-identity -v -p codesigning 2>/dev/null | awk -F\" '/Developer ID Application/ {
              name=$2
              sub(/^Developer ID Application:[[:space:]]*/, "", name)
              print name
              exit
            }')
            if [ -z "$CSC_NAME" ]; then
              echo "::error::No Developer ID Application identity in keychain after import-codesign-certs"
              exit 1
            fi
            export CSC_NAME
            echo "Using signing identity: $CSC_NAME"
          fi
          # 没有 APPLE_API_KEY 时不公证；只留 ID/ISSUER 会让 electron-builder 报「三项缺一」。
          [ -n "${APPLE_API_KEY:-}" ] || unset APPLE_API_KEY_ID APPLE_API_ISSUER
          read -ra args <<< "${{ matrix.args }}"
          # staple code 68（CloudKit 断线）与偶发签名失败：mac 最多重试 3 次。
          max_attempts=1
          if [ "${{ matrix.platform }}" = "mac" ]; then max_attempts=3; fi
          attempt=1
          while true; do
            set +e
            node scripts/dist.mjs "${args[@]}"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              exit "$status"
            fi
            echo "::warning::mac build attempt $attempt failed (exit $status); retrying (staple/keychain flakes)..."
            attempt=$((attempt + 1))
            rm -rf release/mac release/mac-arm64 release/mac-universal \
              release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml 2>/dev/null || true
            sleep $((attempt * 20))
          done
          if [ "${{ matrix.platform }}" = "win" ] && [ -n "$MSSTORE_IDENTITY_NAME" ]; then
            # 商店 MSIX 单独构建、不签名（商店重签；用 Windows 证书签会因发布者不符而失败），
            # 输出到 release-store/ 以免覆盖上面的 NSIS 产物。
            env -u CSC_LINK -u CSC_KEY_PASSWORD node scripts/dist.mjs --win appx --x64 \
              "-c.directories.output=release-store" \
              "-c.appx.identityName=$MSSTORE_IDENTITY_NAME" \
              "-c.appx.publisher=$MSSTORE_PUBLISHER" \
              "-c.appx.publisherDisplayName=$MSSTORE_PUBLISHER_DISPLAY_NAME" \
              "-c.appx.applicationId=KepCup"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}-${{ strategy.job-index }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'win' && vars.MSSTORE_IDENTITY_NAME != ''
        with:
          name: store-msix
          path: apps/desktop/release-store/*.appx
          # 公开仓库上限 90 天；过期后该版本只能等下一个版本再上商店（重跑会因 tag 已存在而跳过）。
          retention-days: 90
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
      - name: Collect assets
        run: |
          mkdir -p assets
          # 两个 macOS runner 各写一份 latest-mac.yml，合并后才是完整的更新清单。
          mapfile -t mac_manifests < <(find dist -name latest-mac.yml)
          if [ "${#mac_manifests[@]}" -ne 2 ]; then
            echo "expected 2 latest-mac.yml, found ${#mac_manifests[@]}"; exit 1
          fi
          node scripts/release/merge-update-manifests.mjs assets/latest-mac.yml "${mac_manifests[@]}"
          while IFS= read -r file; do
            name=$(basename "$file")
            [ ! -e "assets/$name" ] || { echo "duplicate asset $name (two jobs built the same file)"; exit 1; }
            cp "$file" "assets/$name"
          done < <(find dist -type f ! -name latest-mac.yml)
          ls -la assets
          for required in latest.yml latest-mac.yml latest-linux.yml latest-linux-arm64.yml; do
            [ -f "assets/$required" ] || { echo "missing $required"; exit 1; }
          done
      - name: Create release
        run: |
          notes="docs/releases/$TAG.md"
          if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi
          # 上次 publish 中途失败留下的草稿先删掉（草稿还没有 tag）；已正式发布则不应走到这里。
          if is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            [ "$is_draft" = true ] || { echo "$TAG is already published"; exit 1; }
            gh release delete "$TAG" --yes
          fi
          # 先建草稿并上传全部文件，再转正式：electron-updater 只看已发布的 Release。
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "KepCup ${TAG#v}" "${notes_args[@]}"
          gh release upload "$TAG" assets/*
          gh release edit "$TAG" --draft=false --latest
          echo "已发布 [$TAG](https://github.com/$GH_REPO/releases/tag/$TAG)。商店上传：本地运行 node scripts/release/store-upload.mjs ${TAG#v}" >> "$GITHUB_STEP_SUMMARY"
