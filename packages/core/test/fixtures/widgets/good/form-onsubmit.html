<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
  <form id="f" onsubmit="addItem(event)">
    <input id="item" required>
    <button>添加</button>
  </form>
  <ul id="items"></ul>
  <script>
    function addItem(event) {
      event.preventDefault();
      const li = document.createElement('li');
      li.textContent = document.getElementById('item').value;
      document.getElementById('items').append(li);
    }
  </script>
</body>
</html>
