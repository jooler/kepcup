<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
  <div id="weather">加载中…</div>
  <script>
    async function load() {
      const res = await fetch('https://api.example.com/weather?city=beijing');
      const data = await res.json();
      document.getElementById('weather').textContent = data.temp + '°C';
    }
    load();
  </script>
</body>
</html>
