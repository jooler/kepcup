<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
  <ul id="list"></ul>
  <script>
    (function () {
      const items = ['苹果', '香蕉', '橙子'];
      function removeItem(index) {
        items.splice(index, 1);
        draw();
      }
      function draw() {
        document.getElementById('list').innerHTML = items
          .map((item, i) => `<li>${item} <button type="button" onclick="removeItem(${i})">删除</button></li>`)
          .join('');
      }
      draw();
    })();
  </script>
</body>
</html>
