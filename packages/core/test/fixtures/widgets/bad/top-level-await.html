<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
  <p>访问次数：<span id="visits">0</span></p>
  <script>
    const visits = (await kepcup.storage.get('visits')) || 0;
    await kepcup.storage.set('visits', visits + 1);
    document.getElementById('visits').textContent = visits + 1;
  </script>
</body>
</html>
