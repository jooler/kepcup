<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
  <form id="login">
    <input id="user" placeholder="昵称">
    <button type="submit">保存</button>
  </form>
  <p id="msg"></p>
  <script>
    document.getElementById('login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = document.getElementById('user').value;
      await kepcup.storage.set('user', user);
      document.getElementById('msg').textContent = '已保存 ' + user;
    });
  </script>
</body>
</html>
