packages:
  - apps/*
  - packages/*

# pi-ai@1.0.2 的传递 peer + pi-coding-agent 精确依赖 8.10.2 与 core 的 ^8.11.2
# 会把 pi 包分裂成两个实例（双模型目录/双 Agent 类）。统一到 8.11.2 收敛为单实例
# （Phase A 审查 P1-1，todo/pi-1x-upgrade-mcp-subagent.md）。
overrides:
  undici: 8.11.2
  # astro2tsx pins @emnapi/core 1.11.3; pnpm's peer dedupe otherwise pairs it
  # with the 2.0 beta runtime pulled in by rolldown, breaking `astro check`.
  '@emnapi/runtime': 1.11.3

allowBuilds:
  electron: true
  esbuild: true
  better-sqlite3-multiple-ciphers: true
  # Wrangler (apps/website) downloads the local workers runtime in postinstall.
  workerd: true
  # Transitive deps of @earendil-works/pi-ai (postinstall only, no native code)
  '@google/genai': true
  protobufjs: true
  # P13: transitive of electron-builder — its postinstall prepares Squirrel.
  # Windows installers, which we don't use (NSIS); explicitly not built.
  electron-winstaller: false

minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@1.4.0'
  - '@earendil-works/pi-ai@1.4.0'
  - '@earendil-works/pi-codemode@1.4.0'
  - '@earendil-works/pi-coding-agent@1.4.0'
  - '@earendil-works/pi-mcp@1.4.0'
  - '@earendil-works/pi-telemetry@1.4.0'
  - '@earendil-works/pi-tui@1.4.0'
