packages:
  - apps/*
  - packages/*

# pi-ai@1.0.2 的传递 peer + pi-coding-agent 精确依赖 8.10.2 与 core 的 ^8.11.2
# 会把 pi 包分裂成两个实例（双模型目录/双 Agent 类）。统一到 8.11.2 收敛为单实例
# （Phase A 审查 P1-1，todo/pi-1x-upgrade-mcp-subagent.md）。
overrides:
  undici: 8.11.2

allowBuilds:
  electron: true
  esbuild: true
  better-sqlite3-multiple-ciphers: true
  # Transitive deps of @earendil-works/pi-ai (postinstall only, no native code)
  '@google/genai': true
  protobufjs: true
  # P13: transitive of electron-builder — its postinstall prepares Squirrel.
  # Windows installers, which we don't use (NSIS); explicitly not built.
  electron-winstaller: false

minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.71.0'
  - '@typescript-eslint/parser@8.71.0'
  - '@typescript-eslint/project-service@8.71.0'
  - '@typescript-eslint/scope-manager@8.71.0'
  - '@typescript-eslint/tsconfig-utils@8.71.0'
  - '@typescript-eslint/type-utils@8.71.0'
  - '@typescript-eslint/types@8.71.0'
  - '@typescript-eslint/typescript-estree@8.71.0'
  - '@typescript-eslint/utils@8.71.0'
  - '@typescript-eslint/visitor-keys@8.71.0'
  - typescript-eslint@8.71.0
  - '@anthropic-ai/sandbox-runtime@0.0.78'
