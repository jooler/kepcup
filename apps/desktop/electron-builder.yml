# 打包配置（P13 任务 1，docs/dev/phases/P13-release.md）。
# 本机（macOS arm64）验证 dmg/zip；Windows/Linux 目标在 CI 矩阵按平台构建
# （.github/workflows/release.yml），签名凭据一律走 CI 机密、不入库。
#
# 产物剔除（P13 注意事项）：构建入口是 `pnpm dist`（scripts/dist.mjs）——
# 先 electron-vite build（KEPCUP_PACKAGE_BUILD=1 → __KEPCUP_TEST_HOOKS__=false），
# 再用 esbuild 把 @kepcup/core 连同测试缝（mock LLM 播种 / KEYSTORE=memory/file /
# WSL fixture runner）死码剔除后并进 out/main/core-entry/index.js，并把迁移文件拷到
# out/migrations（打包后的 import.meta.url 相对解析）。本工作区里的
# packages/core（dist 仍含测试路径）与 testkit（mock 模型服务/夹具）不进产物。
appId: app.kepcup.desktop
# 用户可见名（bundle 名、安装名、产物名）唯一来源；主进程 app-brand.ts 的
# APP_NAME 与 dev 壳补丁（scripts/patch-dev-electron.cjs）保持一致。
productName: KepCup
# 发行元数据：description/author/license/homepage 取自 package.json（Linux
# deb/AppImage 的 maintainer 与描述来自那里，author.email 必填）。
copyright: Copyright © 2026 kepcup-app
directories:
  output: release
  buildResources: resources
files:
  - out/**
  # core 已并入 out/main/core-entry（并剔除测试路径）；工作区源包不进产物。
  - '!node_modules/@kepcup/core'
  - '!node_modules/@kepcup/testkit'
asar: true
# D72 外部智能体的 stdio ↔ HTTP MCP 代理由子进程（ELECTRON_RUN_AS_NODE=1）直接
# 运行：解出 asar，core 的 resolveStdioProxyPath 把路径映射到 app.asar.unpacked。
asarUnpack:
  - out/main/core-entry/stdio-proxy.mjs
  # D81 组件查询子进程（同样是 ELECTRON_RUN_AS_NODE）require 的 SQLite 驱动：整包解出，
  # core 的 resolveQueryDriverPath 映射到 app.asar.unpacked。smartUnpack 本就会因 .node
  # 整包解出，这里显式写出，不依赖启发式；afterPack（pack-hooks.cjs）硬校验并做一次真实查询。
  - '**/node_modules/better-sqlite3-multiple-ciphers/**/*'
# 原生模块（better-sqlite3-multiple-ciphers、@napi-rs/keyring、es-git）按目标平台
# 架构重编译；smartUnpack 自动把 .node 解包出 asar。
npmRebuild: true

# --- 自动更新源（P13 任务 2；发行流程见 docs/dev/06-release.md） ----------------
# 写进 app-update.yml，electron-updater 匿名读公开仓库的 Releases（仓库必须公开）。
# 运行时可用 KEPCUP_UPDATE_URL 环境变量指向任意 generic HTTPS 源，无需重打包；
# 默认走多源探测选源（GitHub → R2 → OSS，src/main/update-sources.ts）。
# 上传不由 electron-builder 做：scripts/dist.mjs 固定 --publish never，
# release.yml 的 publish job 合并清单后用 gh 一次性发布。
publish:
  provider: github
  owner: jooler
  repo: kepcup

# --- macOS：dmg + zip（自动更新走 zip），arm64 与 x64 分别构建 ------------------
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.productivity
  # icon.icns 由 scripts/generate-icons.mjs 从 resources/KepCup.svg 生成。
  icon: resources/icon.icns
  # 麦克风用途声明（语音输入：按录转文字 / 发送语音消息，docs/design/26-voice-input.md）；
  # 缺声明时打包版 getUserMedia 直接被 macOS 拒绝。
  extendInfo:
    NSMicrophoneUsageDescription: 语音输入需要使用麦克风，用于把语音转为文字或发送语音消息。
    # 摄像头用途声明（传感器 D76，docs/design/31-sensors.md）：设置页预览摄像头及将来的监看。
    NSCameraUsageDescription: 需要使用摄像头，用于在设置中预览画面，以及将来让 Bot 协助监看。
    # D94（docs/design/44-macos-share-extension.md §7.2）：Share Extension 写完
    # App Group inbox 后用 kepcup://share-intake?id=… 唤起主应用。
    CFBundleURLTypes:
      - CFBundleURLName: app.kepcup.desktop.share-intake
        CFBundleURLSchemes:
          - kepcup
  # 签名：CSC_LINK（Developer ID Application .p12）存在时签名，否则 scripts/dist.mjs
  # 设 CSC_IDENTITY_AUTO_DISCOVERY=false 跳过（本机未签名构建）。不要写 identity: null——
  # 它会无视 CSC_LINK 直接跳过签名与公证。
  # 公证：签名成功后，APPLE_API_KEY(.p8 文件路径)/APPLE_API_KEY_ID/APPLE_API_ISSUER 三件套
  # 存在即公证（mac.notarize 未设 = 有凭据就公证）。凭据走 CI 机密，见 docs/dev/06-release.md。
  hardenedRuntime: true
  # JIT/原生模块 + 麦克风/摄像头（hardened runtime 下缺声明会被系统直接拒绝）。
  # D94：App Group 权限的 TeamID 前缀在 beforePack 钩子里展开（electron-builder
  # 不展开 entitlements 里的 $(TeamIdentifierPrefix)），所以这里指向展开后的文件
  # （由 scripts/build-share-extension.mjs 解析 TeamID、pack-hooks 生成）。
  entitlements: resources/entitlements.mac.expanded.plist
  entitlementsInherit: resources/entitlements.mac.expanded.plist
  # D94 §10.2：Share Extension 放进 Contents/PlugIns/（系统分享列表由此可见）。
  # 源目录不存在时 electron-builder 静默跳过（没装 Xcode 的本地构建）。
  # 注意：from 指向 .appex 目录时，electron-builder 的 copyDir 是「把内容拷进 to」——
  # to 必须是 PlugIns/KepCupShare.appex，写成 PlugIns 会摊成 Contents/PlugIns/Contents/…。
  extraFiles:
    - from: resources/share-extension/${arch}/KepCupShare.appex
      to: PlugIns/KepCupShare.appex
  extraResources:
    # 托盘四件套（tray.ts 运行时经 app-brand.trayIconPath 读取，process.resourcesPath/tray）。
    # 按平台各写一份而非顶层 extraResources：electron-builder 的平台块对同名
    # 字段是覆盖语义，顶层条目在 mac/win/linux 块存在时不保证生效。
    - from: resources/tray
      to: tray
    # 平台私有二进制（rg）只打包本机架构一份（${arch} 宏按目标展开）。
    - from: resources/bin/darwin-${arch}
      to: bin/darwin-${arch}
    # D94：App Group 容器 id（带 TeamID 前缀）——主进程据此定位扩展写的 inbox。
    # to 必须写完整文件名：单文件源的 to 不带文件名时，electron-builder 会把它
    # 当目标文件路径，拷出一个名为 share-extension 的文件（主进程读
    # Resources/share-extension/group.json 就落空，回落无前缀组 id、快照写错容器）。
    - from: resources/share-extension/group.json
      to: share-extension/group.json

# --- Windows：NSIS，x64 与 arm64 ------------------------------------------------
# 文件名不能有空格：latest.yml 记录的是连字符形式，gh 上传带空格的文件会被 GitHub 改成点号，
# 更新就会 404。
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  # 代码签名：CI 注入 CSC_LINK/CSC_KEY_PASSWORD（机密 WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD）
  # 时自动签名；无凭据时跳过——GitHub 下载的 exe 会有 SmartScreen 提示。
  # 两个架构在同一次构建里出一个合并安装包和唯一的 latest.yml（分开构建会互相覆盖）。
  # 商店包（appx/MSIX）由 release.yml 按仓库变量追加目标与身份字段，商店负责签名与更新。
  # icon.png（1024 圆角母图）由 electron-builder 转 exe 内嵌 ico。
  icon: resources/icon.png
  extraResources:
    # 同 mac：托盘四件套（win 用彩色 tray.png，任务栏不识别 template 图）。
    - from: resources/tray
      to: tray
    - from: resources/bin/win-${arch}
      to: bin/win-${arch}
    # WSL 私有发行版 rootfs（CI 产出，P12/P13）：按本 pass 目标架构取子目录
    # （x64|arm64 各含 rootfs.tar + manifest；打包后经 core-host 的
    # KEPCUP_WSL_ROOTFS 注入被 core 读取）。原单文件 resources/wsl 整目录
    # 打包会让 arm64 机器带上 x64 rootfs——执行不了还占体量；改 ${arch}
    # 子目录后合并 NSIS 各架构负载只装匹配 WSL2 内核的 rootfs。子目录缺失
    # 由 pack 钩子建 .keep 兜底（空 source dir 会被 electron-builder 跳过），
    # ${arch} 插值模式与上方 resources/bin/${os}-${arch} 一致。
    - from: resources/wsl/${arch}
      to: wsl
    # 内置插件目录已随市场改造移除（core-host.builtinPluginsEnv）；勿再声明
    # resources/plugins，源目录不存在时 electron-builder 会告警。

# --- Linux：AppImage + deb，x64 与 arm64 ----------------------------------------
# deb 默认名用 package.json 的 name（@kepcup/desktop），斜杠会把文件写进子目录。
# Linux executableName 默认取自 package name（会变成 @kepcupdesktop），AppImage
# 拒绝路径里的 @；显式对齐 productName（见 electron-builder PlatformSpecificBuildOptions）。
deb:
  artifactName: kepcup_${version}_${arch}.${ext}
linux:
  executableName: KepCup
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  category: Utility
  maintainer: kepcup-app
  # resources/icons/{n}x{n}.png（generate-icons 产物）→ deb/AppImage 的 hicolor 集与
  # .desktop 图标。
  icon: resources/icons
  extraResources:
    # 同 mac：托盘四件套。
    - from: resources/tray
      to: tray
    - from: resources/bin/linux-${arch}
      to: bin/linux-${arch}
    # 内置插件目录已随市场改造移除（见 win 块注释）。

# 打包前确保按平台条件的 extraResources 源目录存在（缺文件只警告不阻塞）；
# 打包后校验产物：测试路径标记必须不存在、@kepcup/core|testkit 不得进 asar、
# 平台二进制布局正确（scripts/pack-hooks.cjs）。
beforePack: scripts/pack-hooks.cjs
afterPack: scripts/pack-hooks.cjs
